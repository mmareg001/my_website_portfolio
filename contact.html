<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Gloria Mmare</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">Gloria Mmare</a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about_me.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="experience.html">Experience</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <div class="section-title">Contact Me</div>
      <p class="section-copy">Contact me if you like to connect.  I am always open to new opportunities and expanding my network.</p>
      <div class="card">
        <form class="contact-form" action="https://formsubmit.co/ajax/gloria.mmare@gmail.com" method="post">
          <input type="hidden" name="_subject" value="Portfolio contact message" />
          <input type="hidden" name="_captcha" value="false" />

          <label for="name">Name</label>
          <input type="text" id="name" name="Name" required />

          <label for="email">Email</label>
          <input type="email" id="email" name="Email" required />

          <label for="subject">Subject</label>
          <input type="text" id="subject" name="Subject" required />

          <label for="message">Message</label>
          <textarea id="message" name="Message" rows="6" required></textarea>

          <button type="submit">Send</button>
        </form>
      </div>
    </section>
  </main>



  <script>
    const contactForm = document.querySelector('.contact-form');
    if (contactForm) {
      contactForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const formData = new FormData(contactForm);
        const response = await fetch(contactForm.action, {
          method: 'POST',
          headers: {
            Accept: 'application/json',
          },
          body: formData,
        });

        if (response.ok) {
          contactForm.reset();
          const successMessage = document.createElement('div');
          successMessage.className = 'form-success';
          successMessage.textContent = 'Message sent successfully';
          contactForm.parentElement.insertBefore(successMessage, contactForm);

          setTimeout(() => {
            successMessage.remove();
          }, 5000);
        } else {
          alert('Sorry, something went wrong. Please try again.');
        }
      });
    }
  </script>
</body>
</html>
